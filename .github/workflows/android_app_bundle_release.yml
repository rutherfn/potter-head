name: App Bundle (Release)

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
        run: |
          if [ -z "$RELEASE_STORE_FILE_BASE64" ]; then
            echo "::error::Add repository secret RELEASE_STORE_FILE_BASE64 (base64 of your keystore file)."
            exit 1
          fi
          echo "$RELEASE_STORE_FILE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Build signed release app bundle
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-release
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Release app bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "Application ID: \`com.nicholas.rutherford.potter.head\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: **app-bundle-release** (release signing config)" >> "$GITHUB_STEP_SUMMARY"
